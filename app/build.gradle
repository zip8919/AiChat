plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.zip8919.app.aichat'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file("keystore/mc.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("keystorePassword") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: project.findProperty("keyAlias") ?: ""
            keyPassword System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("keystorePassword") ?: ""
        }
    }

    defaultConfig {
        applicationId 'xyz.zip8919.app.aichat'
        minSdk 18
        targetSdk 18
        versionCode 3
        versionName "1.1.0"

        buildConfigField "String", "DEEPSEEK_KEY", "\"${project.findProperty('deepseekKey') ?: 'sk-xxx'}\""
        buildConfigField "String", "SILICONFLOW_KEY", "\"${project.findProperty('siliconflowKey') ?: 'sk-xxx'}\""
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
}
