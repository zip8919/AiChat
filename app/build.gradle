plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.zip8919.app.aichat'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file("keystore/mc.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("keystorePassword") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: project.findProperty("keyAlias") ?: ""
            keyPassword System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("keystorePassword") ?: ""
        }
    }

    defaultConfig {
        applicationId 'xyz.zip8919.app.aichat'
        minSdk 18
        targetSdk 18
        versionCode 21
        versionName "1.4.1"

        // 默认不内置任何 API Key；商汤日日新的 key 可在构建时用 -PsensenovaKey=... 注入
        buildConfigField "String", "SENSENOVA_KEY", "\"${project.findProperty('sensenovaKey') ?: ''}\""
    }

    // 按设备 ABI 拆分安装包：每个包只带一份 libconscrypt_jni.so；另外产出一个通用包
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'ru.noties:jlatexmath-android:0.2.0'
    implementation 'org.commonmark:commonmark:0.21.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.21.0'
}
