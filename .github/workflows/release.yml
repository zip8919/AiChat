name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          export KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
          export KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          ./gradlew assembleRelease --stacktrace \
            -PsensenovaKey="${{ secrets.SENSENOVA_KEY }}" \
            -PkeystorePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PkeyAlias="${{ secrets.KEY_ALIAS }}"

      - name: 生成加速源测速文件
        # 每个 release 内置一个小测速文件。App 测速时会经各镜像下载它并校验首行魔数，
        # 只发 Range 看首字节会把「返回 HTML 错误页但 HTTP 200」的失效镜像误判成可用。
        # 内容必须与 UpdateManager.SPEEDTEST_MAGIC 一致。
        run: |
          printf 'AICHAT_SPEEDTEST_V1\n%s\n' "${{ github.ref_name }}" > app/build/outputs/apk/release/speedtest.txt
          ls -l app/build/outputs/apk/release/speedtest.txt

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          # ABI 分包：app-arm64-v8a / app-armeabi-v7a / app-x86 / app-x86_64 / app-universal
          # 外加测速文件 speedtest.txt（App 测速校验用，pickAsset 会把它从安装包列表里排除）
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/speedtest.txt
          name: AiChat ${{ github.ref_name }}
          # 发布说明随代码进仓库：每版打 tag 前更新 .github/RELEASE_NOTES.md，
          # CI 直接读它当 Release body，不再被自动生成的单行 changelog 覆盖。
          # 注意：提交本文件需 fine-grained PAT 带 workflow scope（见 gh_toks.txt #1）。
          body_path: .github/RELEASE_NOTES.md
